<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org" lang="de"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(content)">
    <head>
        <meta http-equiv="content-type" content="text/html; charset=UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <script th:src="@{/webjars/jquery/jquery.min.js}"
                src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script th:src="@{/webjars/Semantic-UI/semantic.min.js}"
                src="https://cdn.jsdelivr.net/npm/semantic-ui@2.5.0/dist/semantic.min.js"></script>
        <link th:href="@{/webjars/Semantic-UI/semantic.min.css}" rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/semantic-ui@2.5.0/dist/semantic.min.css" type="text/css"/>
        <link th:href="@{/resources/css/style.css}" rel="stylesheet"
              href="../static/resources/css/style.css" type="text/css"/>

        <title th:text="${#strings.isEmpty(title)} ? #{home.title} : ${title}">Videoshop</title>
    </head>
    <body>
        <div class="ui container">
            <header>
                <h1 th:text="${#strings.isEmpty(title)} ? #{home.title} : ${title}">Videoshop</h1>
            </header>
            <nav th:insert="~{navigation :: navigation}"></nav>
            <section th:insert="${content}"></section>
        </div>
    </body>
</html>
